name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/freelearn_radar_test
          AUTH_SECRET: ci-test-auth-secret-with-more-than-thirty-two-characters

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/freelearn_radar_test
          AUTH_SECRET: ci-test-auth-secret-with-more-than-thirty-two-characters
